<!DOCTYPE html>
<html>

<head>
    <title>Cloud Assistant</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f5f5f5;
        }

        input{
            width:350px;
            padding:8px;
        }

        button{
            padding:8px 15px;
            margin-left:5px;
            cursor:pointer;
        }

        #recommendations{
            margin-top:20px;
        }

        .card{

            background:white;

            border:1px solid #ddd;

            border-radius:8px;

            padding:15px;

            margin-bottom:15px;

        }

        .risk{
            font-weight:bold;
            color:#c67c00;
        }

        #log{

            margin-top:20px;

            background:white;

            border:1px solid #ddd;

            padding:15px;

            border-radius:8px;

        }

    </style>

</head>

<body>

<h2>Cloud Resource Assistant</h2>

<input
    type="text"
    id="message"
    placeholder="Enter your cloud request"
/>

<button id="sendBtn">
    Send
</button>

<hr>

<h3>Conversation Log</h3>

<div id="log"></div>

<hr>

<h3>AI Recommendations</h3>

<div id="recommendations"></div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
